# Compilers and flags for the CMake presets of cmake/CMakePresets.json,
# on generic/clang-serial. Spack sets them when the environment is activated and
# removes them when it is deactivated. Unset variables keep CMake's defaults.
---
env_vars:
  set:
    GYSELA_CXX_FLAGS: "-Wall -Werror=unused-local-typedefs -Werror=unused-variable -Wno-sign-compare -Wno-format-security"
    GYSELA_CXX_FLAGS_DEBUG: "-Werror=parentheses"
