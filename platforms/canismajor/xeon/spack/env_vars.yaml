# Compilers and flags for the CMake presets of cmake/CMakePresets.json,
# on canismajor/xeon. Spack sets them when the environment is activated and
# removes them when it is deactivated. Unset variables keep CMake's defaults.
---
env_vars:
  set:
    GYSELA_CXX_FLAGS: "-Wall -Wno-sign-compare -Wno-unused-but-set-variable"
