---
packages:
  cray-mpich:
    buildable: false
    externals:
      - spec: cray-mpich@8.1.30 %gcc@13.3
        prefix: /opt/cray/pe/mpich/8.1.30/ofi/gnu/11.2
        extra_attributes:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.20.1/lib64/
  gcc:
    externals:
      - spec: gcc@13.3.1 languages:='c,c++,fortran'
        prefix: /opt/rh/gcc-toolset-13/root/usr
        extra_attributes:
          compilers:
            c: /opt/rh/gcc-toolset-13/root/usr/bin/gcc
            cxx: /opt/rh/gcc-toolset-13/root/usr/bin/g++
            fortran: /opt/rh/gcc-toolset-13/root/usr/bin/gfortran
  llvm:
    buildable: false
    externals:
      - spec: llvm@20.1.6+clang~flang+lld+lldb
        prefix: /opt/software/gaia/prod/5.0.0/llvm-20.1.6-gcc-13.2.1-jujm
        extra_attributes:
          compilers:
            c: /opt/software/gaia/prod/5.0.0/llvm-20.1.6-gcc-13.2.1-jujm/bin/clang
            cxx: /opt/software/gaia/prod/5.0.0/llvm-20.1.6-gcc-13.2.1-jujm/bin/clang++
