---
packages:
  all:
    permissions:
      read: world
      write: group
    prefer:
      - 'target=zen4'
  c:
    prefer:
      - gcc@13.3.1
  cxx:
    prefer:
      - gcc@13.3.1
  ginkgo:
    require:
      - '+openmp'
  kokkos:
    require:
      - '+openmp'
  kokkos-fft:
    require:
      - 'host_backend=fftw-openmp'
  mpi:
    require:
      - cray-mpich
  lapack:
    require:
      - openblas
