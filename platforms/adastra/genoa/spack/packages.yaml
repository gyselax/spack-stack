---
packages:
  all:
    permissions:
      read: world
      write: group
    target:
      - 'zen4'
  c:
    prefer:
      - 'gcc@13.3'
  cxx:
    prefer:
      - 'gcc@13.3'
  ginkgo:
    require:
      - '+openmp'
  kokkos:
    require:
      - '+openmp'
  kokkos-fft:
    require:
      - 'host_backend=fftw-openmp'
  lapack:
    require:
      - 'openblas'
  mpi:
    require:
      - 'cray-mpich'
