---
packages:
  all:
    permissions:
      read: world
      write: group
    target:
      - 'zen3'
  c:
    prefer:
      - 'gcc@13.3'
  cxx:
    prefer:
      - 'gcc@13.3'
  ginkgo:
    require:
      - '~openmp +rocm amdgpu_target=gfx942'
  kokkos:
    require:
      - '~openmp +rocm ~apu amdgpu_target=gfx942'
  kokkos-fft:
    require:
      - 'host_backend=fftw-serial'
  kokkos-kernels:
    require:
      - '~shared'
  lapack:
    require:
      - 'openblas'
  mpi:
    require:
      - 'cray-mpich'
