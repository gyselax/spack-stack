# Compilers and flags for the CMake presets of cmake/CMakePresets.json,
# on adastra/mi250. Spack sets them when the environment is activated and
# removes them when it is deactivated. Unset variables keep CMake's defaults.
env_vars:
  set:
    GYSELA_CXX_COMPILER: "hipcc"
    GYSELA_C_COMPILER: "amdclang"
    GYSELA_Fortran_COMPILER: "amdflang"
    GYSELA_CXX_FLAGS: "-Wall -Wextra -Wpedantic -Wcast-align -Wformat=2 -Winit-self -Woverloaded-virtual -Wsign-promo -Wstrict-aliasing -Wdisabled-optimization -Wtautological-compare -Wpacked -Wunreachable-code -Wno-sign-compare -Wno-unused-parameter -Wno-unused-but-set-variable"
    GYSELA_EXE_LINKER_FLAGS: "-L/opt/cray/pe/mpich/8.1.30/gtl/lib -lmpi_gtl_hsa"
