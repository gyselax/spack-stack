---
packages:
  all:
    permissions:
      read: world
      write: group
    target:
      - 'sapphirerapids'
  c:
    prefer:
      - 'gcc@14.2'
  cxx:
    prefer:
      - 'gcc@14.2'
  ginkgo:
    require:
      - '~openmp +cuda cuda_arch=90'
  kokkos:
    require:
      - '~openmp +cuda cuda_arch=90'
  kokkos-fft:
    require:
      - 'host_backend=fftw-serial'
  kokkos-kernels:
    require:
      - '~shared'
  lapack:
    require:
      - 'openblas@0.3 ~dynamic_dispatch'
  mpi:
    require:
      - 'openmpi@4.1'
  py-jaxlib:
    require:
      - '%cxx=llvm@18'
      - '+cuda cuda_arch=90'
  py-ml-dtypes:
    require:
      - 'target=:icelake'
