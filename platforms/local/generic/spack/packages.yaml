---
packages:
  all:
    permissions:
      read: world
      write: user
    prefer:
      - '~fortran'
      - '~mpi'
      - '+openmp'
  c:
    prefer:
      - 'gcc'
  cxx:
    prefer:
      - 'gcc'
  ginkgo:
    require:
      - '+openmp'
  kokkos:
    require:
      - '+openmp'
  kokkos-fft:
    require:
      - 'host_backend=fftw-openmp'
  kokkos-kernels:
    require:
      - '~shared'
  lapack:
    require:
      - 'openblas'
  mpi:
    require:
      - 'openmpi'
