---
spack:
  include:
    - path: gysela/externals.yaml
      optional: true
    - path: gysela
      optional: true
  specs:
    - cxx
    - cmake@3.31
    - ddc@0.15 +pdi
    - gyselalibxx@0.8
    - mpi
    - paraconf@1.0
    - pdi@1.11

    - py-dask
    - py-deisa-dask@0.7.0
    - py-deisa-ray@0.1.9
    - py-dask-ml@2025.1.0
    - py-distributed@2025.5.0
    - py-equinox
    - py-h5py +mpi
    - py-iops-benchmark +bayesian
    - py-jax
    - py-matplotlib
    - py-mpi4py
    - py-numpy
    - py-pyyaml
    - py-scikit-learn
    - py-scimba
    - py-tqdm
    - py-xarray
  concretizer:
    reuse: false
    unify: true
  packages:
    arrow:
      prefer:
        - '~mimalloc'
    hdf5:
      require:
        - '+subfiling'
    py-dask:
      prefer:
        - '~dataframe'
    py-jaxlib:
      require:
        - '%llvm'
    py-pandas:
      prefer:
        - '~performance'
    py-torch:
      prefer:
        - '~valgrind'
    npm:
      require:
        - '@10.9.8'
  repos:
    deisa:
      git: https://github.com/deisa-project/spack.git
      commit: 1f8cb0c9f6b7c5f84e8ba3cffb79bc7ba43ea266
      destination: $env/repos/deisa
    patches:
      git: https://github.com/gyselax/spack.git
      commit: f4b9b7c92f58b85831f7ea1d1f5336d6384e50a2
      destination: $env/repos/gysela-patches
    builtin:
      tag: v2026.10.1
      destination: $spack/var/spack/repos/builtin-v2026.10.1
