spack:
  include:
    - path: gysela/externals.yaml
      optional: true
    - path: gysela
      optional: true
  specs:
    - cxx
    - cmake@3.31
    - ddc@0.15 +pdi
    - gyselalibxx@0.8
    - mpi
    - paraconf@1.0
    - pdi@1.11

    - py-dask
    - py-deisa-dask +mpi
    - py-deisa-ray
    - py-distributed
    - py-equinox
    - py-h5py +mpi
    - py-iops-benchmark +bayesian
    - py-jax
    - py-matplotlib
    - py-mpi4py
    - py-numpy
    - py-pyyaml
    - py-scikit-learn
    - py-scimba
    - py-tqdm
    - py-xarray
  concretizer:
    reuse: false
    unify: true
  packages:
    arrow:
      prefer:
        - '~mimalloc'
    hdf5:
      require:
        - '+subfiling'
    py-dask:
      prefer:
        - '~dataframe'
    py-h5py:
      require:
        - '+mpi'
    py-jaxlib:
      require:
        - '%llvm'
    py-pandas:
      prefer:
        - '~performance'
    py-torch:
      prefer:
        - '~valgrind'
    npm:
      require:
        - '@10.9.8'
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2026.10
      destination: $env/repos/patches-v2026.10
    builtin:
      branch: releases/v2026.10
      destination: $spack/var/spack/repos/builtin-v2026.10
