---
spack:
  include:
    - path: gysela/externals.yaml
      optional: true
    - path: gysela
      optional: true
  specs:
    - cxx
    - cmake@3.31
    - ddc@0.15 +pdi
    - gyselalibxx@0.8
    - mpi
    - paraconf@1.0
    - pdi@1.11

    - py-dask
    - py-deisa-dask@0.7.0
    - py-deisa-ray@0.1.9
    - py-dask-ml@2025.1.0
    - py-distributed@2025.5.0
    - py-h5py +mpi
    - py-iops-benchmark +bayesian
    - py-matplotlib
    - py-mpi4py
    - py-numpy
    - py-pyyaml
    - py-scikit-learn
    - py-tqdm
    - py-xarray +io
  concretizer:
    reuse: false
    unify: true
    duplicates:
      max_dupes:
        bazel: 4
        java: 4
        openjdk: 4
  packages:
    hdf5:
      require:
        - '+subfiling'
    py-llvmlite:
      require:
        - '%llvm ~clang'
    py-pandas:
      prefer:
        - '~performance'
    npm:
      require:
        - '@10.9.8'
  repos:
    deisa:
      git: https://github.com/deisa-project/spack.git
      commit: 1f8cb0c9f6b7c5f84e8ba3cffb79bc7ba43ea266
      destination: repos/deisa
    patches:
      git: https://github.com/gyselax/spack.git
      commit: 7f19e5e7b2f68939b3eefdc14b9472e6e3df374a
      destination: repos/gysela-patches
    builtin:
      tag: v2026.10.1
      destination: $spack/var/spack/repos/builtin-v2026.10.1
  view:
    default:
      root: .spack-env/view
      projections:
        all: "{name}-{version}-{hash}"
      exclude:
        - 'gcc-runtime'
