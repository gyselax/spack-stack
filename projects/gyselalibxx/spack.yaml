spack:
  include:
    - path: gysela/externals.yaml
      optional: true
    - path: gysela
      optional: true
  specs:
    - cxx
    - cmake@3.31
    - ddc@0.17 +fft +pdi +splines
    - ginkgo@1.11
    - gmgpolar@2.4
    - googletest@1.17 +gmock
    - kokkos@5.1
    - kokkos-kernels@5.1
    - koliop@1.1
    - lapack
    - mpi
    - ninja@1.13
    - paraconf@1.0
    - pdi@1.11
    - pdiplugin-decl-hdf5@1.11 +mpi
    - pdiplugin-mpi@1.11
    - pdiplugin-set-value@1.11
    - python@3.14

    - py-h5py@3.16
    - py-imageio@2.37
    - py-matplotlib@3.11
    - py-numpy@2.4
    - py-pyyaml@6.0
    - py-scipy@1.17
    - py-sympy@1.14
    - py-xarray@2026.4

    - kokkos-tools@5.2
  concretizer:
    reuse: false
    unify: true
  packages:
    py-pandas:
      prefer:
        - '~performance'
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2026.10
      destination: $env/repos/patches-v2026.10
    builtin:
      branch: releases/v2026.10
      destination: $spack/var/spack/repos/builtin-v2026.10
